name: Setup Branch Protection

# Run this ONCE manually from Actions → Setup Branch Protection → Run workflow.
# It applies classic branch protection to main (works on free GitHub plans):
#   - blocks direct pushes (requires a PR)
#   - requires expo-doctor, type-check, and audit to pass before merge
#   - enforces on admins (no bypass)
#
# Uses the built-in GITHUB_TOKEN — no PAT required.

on:
  workflow_dispatch:

jobs:
  protect:
    name: Apply main branch protection
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Apply branch protection rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            repos/${{ github.repository }}/branches/main/protection \
            --input - <<'EOF'
          {
            "required_status_checks": {
              "strict": false,
              "contexts": ["expo-doctor", "type-check", "audit"]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": null,
            "restrictions": null
          }
          EOF
